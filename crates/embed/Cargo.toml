[package]
name = "lightcraft-embed"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "LightCraft embeddings: the SigLIP 2 image and text towers in pure Rust on candle, for VERA's vector lane (L3)"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

# the model runs natively only (the web build reports the vector lane as needs_desktop)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
candle-core = { workspace = true }
candle-nn = { workspace = true }
lightcraft-fetch = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["metal"] }
candle-nn = { workspace = true, features = ["metal"] }

[dev-dependencies]
lightcraft-scenes = { workspace = true }
lightcraft-raster = { workspace = true }
