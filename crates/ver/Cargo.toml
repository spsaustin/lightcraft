[package]
name = "lightcraft-ver"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft VER standard core (L3): CPNP-1 canonicalisation, identity hashes, VER Records, structural + profile validation, the published decoder corpus"

[lints]
workspace = true

[dependencies]
lightcraft-codecs = { workspace = true }
lightcraft-vera = { workspace = true }
moxcms = { workspace = true }
png = { workspace = true }
tiff = { workspace = true }
image-webp = { workspace = true }
gif = "0.14"
image = { workspace = true, features = ["bmp"] }
miniz_oxide = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
half = { workspace = true }
jsonschema = { workspace = true }
# SystemTime that works on wasm32 (std's panics there); a re-export of std on native targets
web-time = { workspace = true }

[dev-dependencies]
jpeg-encoder = { workspace = true }
crc32fast = { workspace = true }
zune-jpeg = { workspace = true }
zune-core = { workspace = true }
jpeg-decoder = { workspace = true }
